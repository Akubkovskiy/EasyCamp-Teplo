name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  TELEGRAM_BOT_TOKEN: "1234567890:AAEhBP0av28cxuwxxxxxxxxxxxxxxxxxxxx"
  TELEGRAM_CHAT_ID: "1"
  DATABASE_URL: "sqlite+aiosqlite:///./test.db"
  GOOGLE_SHEETS_CREDENTIALS_FILE: "google-credentials.json"
  GOOGLE_SHEETS_SPREADSHEET_ID: ""
  AVITO_CLIENT_ID: "test"
  AVITO_CLIENT_SECRET: "test"
  AVITO_REDIRECT_URI: "http://localhost"
  RESTORE_FROM_DRIVE_ENABLED: "false"
  RESTORE_MAINTENANCE_MODE: "false"

jobs:
  quality:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -r requirements-dev.txt
      - run: python scripts/verify_release.py

  security:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -r requirements-dev.txt
      - run: bandit -q -r app -lll
      - run: pip-audit -r requirements.txt

  docker:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    needs: [quality]
    steps:
      - uses: actions/checkout@v4
      - run: cp .env.example .env
      - run: docker compose config --quiet
      - run: docker build --tag easycamp:${{ github.sha }} .
